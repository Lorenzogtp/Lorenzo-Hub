<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111820">
<title>Fenice 4.9.3 · Lorenzo Hub</title>
<style>
html,body{margin:0;height:100%;background:#111820;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}
#bar{position:fixed;z-index:9999;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;pointer-events:none}
#bar button,#bar .state{pointer-events:auto;border:0;border-radius:999px;padding:9px 12px;font-weight:800;box-shadow:0 3px 14px rgba(0,0,0,.25)}
#bar button{background:#101820;color:#fff}
#bar .state{background:rgba(255,255,255,.92);color:#111;font-size:12px;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<iframe id="frame" src="https://lorenzogtp.github.io/fenice-palcoscenico-/" title="Fenice Palcoscenico 4.9.3"></iframe>
<div id="bar">
  <button onclick="history.length>1?history.back():location.href='./index.html'">← Hub</button>
  <div class="state" id="state">Apro Fenice 4.9.3…</div>
</div>
<script>
const section = new URLSearchParams(location.search).get('section') || 'home';
const frame = document.getElementById('frame');
const state = document.getElementById('state');

const labels = {
  home:'Home',
  today:'Oggi',
  tomorrow:'Domani',
  smart:'ODG Smart',
  productions:'Produzioni',
  'new-production':'Nuova produzione',
  plan:'Piano prove',
  'plan-smart':'ODG Smart da Piano prove',
  cast:'Cast / Solisti',
  rooms:'Camerini',
  calendar:'Calendario',
  search:'Ricerca globale',
  stage:'Palcoscenico oggi',
  backup:'Backup / Import',
  archive:'Archivio produzioni'
};
state.textContent = 'Fenice 4.9.3 · ' + (labels[section] || section);

function norm(s){ return (s||'').replace(/\s+/g,' ').trim().toLowerCase(); }

function clickByText(doc, variants){
  const wants = variants.map(norm);
  const els = [...doc.querySelectorAll('button,a,[role="button"],summary')];
  for(const el of els){
    const t = norm(el.innerText || el.textContent);
    if(wants.some(w => t===w || t.includes(w))){
      try{ el.click(); return true; }catch(e){}
    }
  }
  return false;
}

function call(w, name, ...args){
  try{
    if(typeof w[name] === 'function'){
      w[name](...args);
      return true;
    }
  }catch(e){}
  return false;
}

function route(){
  let w, d;
  try{
    w = frame.contentWindow;
    d = frame.contentDocument || w.document;
  }catch(e){
    state.textContent='Fenice aperta · selezioni la sezione';
    return;
  }

  try{
    switch(section){
      case 'home':
        if(!call(w,'home')) clickByText(d,['home','⌂']);
        break;

      case 'today':
        if(!call(w,'openDay',0)) clickByText(d,['oggi']);
        break;

      case 'tomorrow':
        if(!call(w,'openDay',1)) clickByText(d,['domani','giorno dopo']);
        break;

      case 'smart':
        if(typeof w.openSmart==='function'){
          let date='';
          try{ date = typeof w.todayYMD==='function' ? w.todayYMD() : ''; }catch(e){}
          w.openSmart(date);
        } else if(!call(w,'openPanel','smart')){
          clickByText(d,['odg smart']);
        }
        break;

      case 'productions':
        if(!call(w,'openPanel','productions')) clickByText(d,['produzioni']);
        break;

      case 'new-production':
        call(w,'openPanel','productions');
        setTimeout(()=>{
          if(!call(w,'showNewProductionForm')) clickByText(d,['nuova produzione','+ nuova produzione']);
        },250);
        break;

      case 'plan':
        if(!call(w,'openPanel','plan')) clickByText(d,['piano prove']);
        break;

      case 'plan-smart':
        call(w,'openPanel','plan');
        setTimeout(()=>{
          // V4.9.x: cerca il comando ODG presente nella sezione Piano prove.
          if(!clickByText(d,['odg smart','odg','genera odg'])){
            state.textContent='Fenice 4.9.3 · Piano prove (ODG disponibile nella sezione)';
          }
        },450);
        break;

      case 'cast':
        if(!call(w,'openPanel','cast')) clickByText(d,['cast / solisti','cast','solisti']);
        break;

      case 'rooms':
        if(!call(w,'openPanel','rooms')) clickByText(d,['camerini']);
        break;

      case 'calendar':
        if(!call(w,'openPanel','calendar')) clickByText(d,['calendario']);
        break;

      case 'search':
        if(!call(w,'openPanel','search')) clickByText(d,['ricerca','cerca']);
        break;

      case 'stage':
        if(!call(w,'openStage',0)){
          clickByText(d,['palcoscenico','modalità palcoscenico']);
        }
        break;

      case 'backup':
        if(!call(w,'openPanel','backup')) clickByText(d,['backup / import','backup','import']);
        break;

      case 'archive':
        if(!call(w,'openPanel','productions')) clickByText(d,['produzioni','archivio produzioni']);
        break;
    }
  }catch(e){
    state.textContent='Fenice 4.9.3 · apertura manuale';
  }
}

frame.addEventListener('load',()=>{
  // Wait for the app's own initialization/localStorage restoration.
  setTimeout(route,450);
  setTimeout(route,1200);
});
</script>
</body>
</html>
